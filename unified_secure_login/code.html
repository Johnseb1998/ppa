<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-background text-on-background font-body-md ambient-bg min-h-screen flex items-center justify-center p-4">
<!-- Floating Action Tab (Book Now) - Rendered per prompt request despite general FAB rules, as specifically requested for this view -->
<a class="fixed right-0 top-1/2 -translate-y-1/2 bg-primary text-on-primary py-3 px-4 rounded-l-lg shadow-md flex items-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors z-50 group" href="#">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
<span class="font-label-md hidden group-hover:inline-block whitespace-nowrap">Book Now</span>
</a>
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(26,37,48,0.08)] border border-surface-variant overflow-hidden">
<!-- Header -->
<div class="p-8 text-center bg-surface-container-lowest pb-4">
<div class="flex justify-center mb-4 text-primary">
<span class="material-symbols-outlined text-display-lg" data-icon="clinical_notes" data-weight="fill">clinical_notes</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary mb-2">Healing Mind</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Sign in to your account</p>
</div>
<!-- Role Tabs -->
<div class="flex border-b border-surface-variant px-8 mb-6">
<button class="flex-1 pb-3 text-center font-label-md text-label-md transition-colors role-tab-active" onclick="switchRole('client')">Client</button>
<button class="flex-1 pb-3 text-center font-label-md text-label-md transition-colors role-tab-inactive hover:text-primary" onclick="switchRole('therapist')">Therapist</button>
<button class="flex-1 pb-3 text-center font-label-md text-label-md transition-colors role-tab-inactive hover:text-primary" onclick="switchRole('admin')">Admin</button>
</div>
<!-- Form Area -->
<div class="px-8 pb-8">
<form class="space-y-4" id="loginForm">
<!-- Dynamic ID Field -->
<div id="idFieldContainer">
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-1" for="userId" id="userIdLabel">Mobile Number</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="userId" name="username" autocomplete="username" placeholder="Enter your mobile number" type="text"/>
</div>
<!-- Password -->
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-1" for="password">Password</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" type="password"/>
</div>
<!-- OTP (Always present per prompt) -->
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-1" for="otp">One-Time Password (OTP)</label>
<div class="flex gap-2">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="otp" placeholder="Enter 6-digit OTP" type="text"/>
<button class="h-12 px-4 whitespace-nowrap rounded-lg border border-primary text-primary font-label-md text-label-md hover:bg-surface-container-low transition-colors" type="button">Send OTP</button>
</div>
</div>
<!-- Dynamic Passkey Field -->
<div class="hidden" id="passkeyFieldContainer">
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-1" for="passkey" id="passkeyLabel">Passkey</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="passkey" maxlength="6" placeholder="Enter passkey" type="password"/>
</div>
<div class="flex justify-between items-center pt-2">
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<button class="w-full h-12 mt-6 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors shadow-sm" type="submit">
                    Sign In
                </button>
<div class="text-center mt-6">
<p class="text-body-sm font-body-sm text-on-surface-variant">
                        New user? <a class="text-primary font-label-md hover:underline" href="../registration_clinical_consent/code.html">Register here</a>
</p>
</div>
</form>
</div>
</div>
<script>
        function switchRole(role) {
            // Update Tab Styling
            const tabs = document.querySelectorAll('.flex > button');
            tabs.forEach(tab => {
                tab.classList.remove('role-tab-active');
                tab.classList.add('role-tab-inactive');
            });
            
            // Find active tab based on text
            const activeTab = Array.from(tabs).find(t => t.textContent.toLowerCase() === role);
            if(activeTab) {
                activeTab.classList.remove('role-tab-inactive');
                activeTab.classList.add('role-tab-active');
            }

            // Update Form Fields
            const idLabel = document.getElementById('userIdLabel');
            const idInput = document.getElementById('userId');
            const passkeyContainer = document.getElementById('passkeyFieldContainer');
            const passkeyLabel = document.getElementById('passkeyLabel');
            const passkeyInput = document.getElementById('passkey');

            if (role === 'client') {
                idLabel.textContent = 'Mobile Number';
                idInput.placeholder = 'Enter your mobile number';
                passkeyContainer.classList.add('hidden');
            } else if (role === 'therapist') {
                idLabel.textContent = 'Therapist ID';
                idInput.placeholder = 'Enter your Therapist ID';
                passkeyContainer.classList.remove('hidden');
                passkeyLabel.textContent = '4-Digit Passkey';
                passkeyInput.placeholder = 'Enter 4-digit passkey';
                passkeyInput.maxLength = 4;
            } else if (role === 'admin') {
                idLabel.textContent = 'Admin ID';
                idInput.placeholder = 'Enter your Admin ID';
                passkeyContainer.classList.remove('hidden');
                passkeyLabel.textContent = '6-Digit Passkey';
                passkeyInput.placeholder = 'Enter 6-digit passkey';
                passkeyInput.maxLength = 6;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('userId').value.trim();
            const pass = document.getElementById('password').value;
            const roleTab = document.querySelector('.role-tab-active');
            const role = roleTab ? roleTab.textContent.toLowerCase() : 'client';
            
            if (id) {
                // Verify credentials against localStorage database
                let users = {};
                try {
                    users = JSON.parse(localStorage.getItem('healingMindUsers')) || {};
                } catch(e) {}

                if (role === 'client') {
                    if (!users[id] || users[id].password !== pass) {
                        alert("Invalid Mobile Number or Password. Please try again.");
                        return;
                    }
                }

                localStorage.setItem('loggedInUser', id);
                localStorage.setItem('userRole', role);
                
                // Check if coming from registration flow
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('flow') === 'registration' && role === 'client') {
                    window.location.href = '../registration_health_history/code.html';
                } else if (role === 'client') {
                    window.location.href = '../client_dashboard/code.html';
                } else if (role === 'therapist') {
                    window.location.href = '../therapist_dashboard_home/code.html';
                } else {
                    window.location.href = '../admin_dashboard_overview/code.html'; // Fallback
                }
            } else {
                alert("Please enter your ID/Mobile Number.");
            }
        });
    </script>
</body></html>
