<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

ns"], "label-sm": ["Public Sans"], headline: ["Public Sans"], display: ["Public Sans"], body: ["Public Sans"], label: ["Public Sans"]}, fontSize: {"body-lg": ["18px", {lineHeight: "28px", fontWeight: "400"}], "body-sm": ["14px", {lineHeight: "20px", fontWeight: "400"}], "headline-md": ["24px", {lineHeight: "32px", fontWeight: "600"}], "body-md": ["16px", {lineHeight: "24px", fontWeight: "400"}], "headline-lg": ["32px", {lineHeight: "40px", fontWeight: "600"}], "headline-lg-mobile": ["24px", {lineHeight: "32px", fontWeight: "600"}], "label-md": ["14px", {lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600"}], "display-lg": ["48px", {lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700"}], "label-sm": ["12px", {lineHeight: "14px", fontWeight: "500"}]}}}};</script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        
        .role-tab-active {
            border-bottom: 2px solid theme('colors.primary');
            color: theme('colors.primary');
        }
        .role-tab-inactive {
            color: theme('colors.on-surface-variant');
            border-bottom: 2px solid transparent;
        }

        /* Ambient subtle gradient for background */
        .ambient-bg {
            background: linear-gradient(135deg, theme('colors.background') 0%, theme('colors.surface-container-low') 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md ambient-bg min-h-screen flex items-center justify-center p-4">
<!-- Floating Action Tab (Book Now) -->
<a class="fixed right-0 top-1/2 -translate-y-1/2 bg-primary text-on-primary py-3 px-4 rounded-l-lg shadow-md flex items-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors z-50 group" href="#">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
<span class="font-label-md hidden group-hover:inline-block whitespace-nowrap">Book Now</span>
</a>
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(26,37,48,0.08)] border border-surface-variant overflow-hidden">
<!-- Header -->
<div class="p-8 text-center bg-surface-container-lowest pb-4">
<div class="flex justify-center mb-4 text-primary">
<span class="material-symbols-outlined text-display-lg" data-icon="clinical_notes" data-weight="fill">clinical_notes</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary mb-2">Healing Mind</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Sign in to your account</p>
</div>
<!-- Form Area -->
<div class="px-8 pb-8 pt-4">
<form class="space-y-4" id="loginForm">

<!-- Step 1: ID and Password -->
<div id="step1">
    <div>
        <label class="block text-label-sm font-label-sm text-on-surface-variant mb-1" for="userId">Login ID or Phone Number</label>
        <input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="userId" placeholder="Enter Login ID or Phone Number" type="text" required/>
    </div>
    <div class="mt-4">
        <label class="block text-label-sm font-label-sm text-on-surface-variant mb-1" for="password">Password</label>
        <input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="password" placeholder="Enter your password" type="password" required/>
    </div>
    <div class="flex justify-between items-center pt-2">
        <a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Forgot Password?</a>
    </div>
</div>

<!-- Step 2: OTP -->
<div id="step2" class="hidden">
    <div>
        <label class="block text-label-sm font-label-sm text-on-surface-variant mb-1" for="otp">One-Time Password (OTP)</label>
        <div class="flex gap-2">
            <input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="otp" placeholder="Enter 6-digit OTP" type="text"/>
            <button class="h-12 px-4 whitespace-nowrap rounded-lg border border-primary text-primary font-label-md text-label-md hover:bg-surface-container-low transition-colors" type="button">Resend OTP</button>
        </div>
    </div>
</div>

<!-- Step 3: Passkey -->
<div id="step3" class="hidden">
    <div>
        <label class="block text-label-sm font-label-sm text-on-surface-variant mb-1" for="passkey">6-Digit Passkey</label>
        <input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="passkey" maxlength="6" placeholder="Enter passkey" type="password"/>
    </div>
</div>

<button id="submitBtn" class="w-full h-12 mt-6 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors shadow-sm" type="submit">
    Next
</button>
<div class="text-center mt-6">
<p class="text-body-sm font-body-sm text-on-surface-variant">
    New user? <a class="text-primary font-label-md hover:underline" href="registration_clinical_consent/code.html">Register here</a>
</p>
</div>
</form>
</div>
</div>
<script>
    // Initialize database in localStorage
    const defaultUsers = {
        '9876543210': { name: 'anu', role: 'client', password: 'qwerty54321' },
        'john123': { name: 'john', role: 'therapist', password: 'asdfgh1234' },
        'admin': { name: 'admin', role: 'admin', password: 'zxcvb1234', passkey: '123456' }
    };

    // Only set default if database doesn't exist so we can save new members later
    if (!localStorage.getItem('healingMindUsers')) {
        localStorage.setItem('healingMindUsers', JSON.stringify(defaultUsers));
    }

    // Helper to get users
    function getUsers() {
        return JSON.parse(localStorage.getItem('healingMindUsers'));
    }

    // Helper to register new users (can be called from a registration page)
    window.registerUser = function(id, name, role, password, passkey = null) {
        const users = getUsers();
        users[id] = { name, role, password, passkey };
        localStorage.setItem('healingMindUsers', JSON.stringify(users));
    };

    let currentStep = 1;
    let detectedRole = null;
    let loggedInUserId = null;

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent the default form submission which reloads the page
        
        if (currentStep === 1) {
            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value;
            const users = getUsers();

            // Validate User ID
            if (!users[userId]) {
                alert('User not found. Please check your Login ID or Phone Number.');
                return;
            }

            // Validate Password
            if (users[userId].password !== password) {
                alert('Incorrect password.');
                return;
            }

            // Authentication successful for step 1
            loggedInUserId = userId;
            detectedRole = users[userId].role;
            
            // Move to Step 2 (OTP)
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('submitBtn').textContent = 'Verify OTP';
            currentStep = 2;
        } 
        else if (currentStep === 2) {
            const otp = document.getElementById('otp').value;
            
            // Validate OTP
            if (otp !== '123456') {
                alert('Invalid OTP. (Demo OTP is 123456)');
                return;
            }

            if (detectedRole === 'admin') {
                // Admin goes to Passkey
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
                document.getElementById('submitBtn').textContent = 'Sign In';
                currentStep = 3;
            } else {
                // Client or Therapist goes to dashboard
                localStorage.setItem('loggedInUser', loggedInUserId);
                if (detectedRole === 'client') {
                    window.location.href = 'client_dashboard/code.html';
                } else if (detectedRole === 'therapist') {
                    window.location.href = 'therapist_dashboard_home/code.html';
                }
            }
        }
        else if (currentStep === 3) {
            const passkey = document.getElementById('passkey').value;
            const users = getUsers();
            
            // Validate Passkey for Admin
            if (users[loggedInUserId].passkey !== passkey) {
                alert('Invalid Passkey.');
                return;
            }

            // Admin final step
            localStorage.setItem('loggedInUser', loggedInUserId);
            window.location.href = 'admin_dashboard_overview/code.html';
        }
    });
</script>
</body></html>
