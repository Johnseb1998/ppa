<script>
        // Simple script to toggle OTP visibility for demonstration
        const sendOtpBtn = Array.from(document.querySelectorAll('button')).find(b => b.textContent.includes('Send OTP'));
        if (sendOtpBtn) {
            sendOtpBtn.addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('otpSection').classList.remove('hidden');
            });
        }
        
        // Auto-focus next OTP input
        const otpInputs = document.querySelectorAll('#otpSection input[type="text"]');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // Registration form submission logic
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            if (!fullName || !phone || !password) {
                alert("Please fill in your Full Name, Phone Number, and Password to continue.");
                return;
            }

            // Get existing users or initialize empty object if doesn't exist
            let users = {};
            try {
                users = JSON.parse(localStorage.getItem('healingMindUsers')) || {};
            } catch (e) {
                users = {};
            }

            // Generate unique 5-digit Client ID starting from 10001
            let maxId = 10000;
            Object.values(users).forEach(u => {
                if (u.role === 'client' && u.clientId) {
                    const idNum = parseInt(u.clientId, 10);
                    if (!isNaN(idNum) && idNum > maxId) {
                        maxId = idNum;
                    }
                }
            });
            const newClientId = String(maxId + 1);

            // Register the new user
            users[phone] = {
                clientId: newClientId,
                name: fullName,
                role: 'client',
                password: password,
                dob: document.getElementById('dob').value,
                sex: document.getElementById('sex').value,
                gender: document.getElementById('gender').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                district: document.getElementById('district').value,
                state: document.getElementById('state').value,
                occupation: document.getElementById('occupation').value,
                registrationDate: new Date().toISOString()
            };

            // Save back to "database" (localStorage)
            localStorage.setItem('healingMindUsers', JSON.stringify(users));

            // Optional: Store the newly registered phone number for subsequent steps to link data if needed
            sessionStorage.setItem('registeringUserId', phone);

            // Redirect to next step
            window.location.href = '../unified_secure_login/code.html?flow=registration';
        });
    </script>
